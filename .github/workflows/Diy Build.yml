name: Build Padavan-NG YK-L1 3.4.4.0-104

on:
  workflow_dispatch:
  push:
    branches:
      - padavan-ng-104

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4
        with:
          ref: padavan-ng-104

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint cmake bison build-essential \
            flex gawk gettext git gperf libtool libtool-bin pkg-config \
            fakeroot kmod cpio doxygen texinfo help2man \
            libncurses5-dev zlib1g-dev libsqlite3-dev gcc-multilib \
            curl dos2unix unzip wget locales xxd libltdl-dev \
            libgmp3-dev libmpfr-dev libarchive-tools libblkid-dev \
            ca-certificates zstd

      - name: Download Padavan-NG source
        run: |
          set -e
          git clone https://github.com/nilabsent/padavan-ng.git padavan-ng
          cd padavan-ng
          git checkout d2c584629

      - name: Verify YK-L1 board support
        run: |
          set -e
          echo "===== Custom configuration ====="
          test -s trunk/configs/templates/YK-L1.config

          echo "===== Padavan-NG board definitions ====="
          find padavan-ng/trunk/configs/boards -maxdepth 3 \
            -type f 2>/dev/null | grep -Ei 'youku|yk.?l1' || true

          echo "===== Available templates ====="
          find padavan-ng/trunk/configs/templates -type f \
            2>/dev/null | head -100

          echo "===== Check required board files ====="
          if [ ! -d padavan-ng/trunk/configs/boards/YOUKU/YK-L1 ]; then
            echo "::error::YK-L1 board definition was not found in Padavan-NG."
            echo "The template alone is insufficient; board files must be ported before building."
            exit 1
          fi

      - name: Prepare YK-L1 configuration
        run: |
          set -e
          cp trunk/configs/templates/YK-L1.config padavan-ng/trunk/.config
          grep -E '^(CONFIG_VENDOR|CONFIG_PRODUCT|CONFIG_FIRMWARE_PRODUCT_ID|CONFIG_FIRMWARE_WIFI2_DRIVER)=' \
            padavan-ng/trunk/.config

      - name: Build toolchain
        run: |
          set -e
          cd padavan-ng/toolchain
          ./build_toolchain.sh

      - name: Build firmware
        run: |
          set -e
          cd padavan-ng/trunk
          ./clear_tree.sh
          ./build_firmware.sh

      - name: Check firmware output
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/output"
          find padavan-ng/trunk/images -maxdepth 1 -type f \
            \( -name '*.trx' -o -name '*.bin' \) -print

          IMAGE="$(find padavan-ng/trunk/images -maxdepth 1 -type f \
            \( -name '*.trx' -o -name '*.bin' \) -print -quit)"

          test -n "$IMAGE"
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"
          cp "$IMAGE" "$GITHUB_WORKSPACE/output/"
          cp trunk/configs/templates/YK-L1.config "$GITHUB_WORKSPACE/output/"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-NG-YK-L1-3.4.4.0-104
          path: output/*
          if-no-files-found: error
          retention-days: 14
