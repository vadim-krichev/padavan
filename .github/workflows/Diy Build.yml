name: Build Padavan YK-L1

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip libtool-bin curl cmake gperf gawk flex bison \
            xxd fakeroot cpio git python3-docutils gettext \
            automake autopoint texinfo build-essential help2man \
            pkg-config zlib1g-dev libgmp3-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libltdl-dev wget \
            squashfs-tools file

      - name: Download Padavan source
        run: |
          set -e
          git clone --depth=1 https://github.com/a0575/padavan.git /opt/rt-n56u
          test -f /opt/rt-n56u/trunk/configs/templates/YK-L1.config
          mkdir -p "$GITHUB_WORKSPACE/output"

      - name: Analyze OpenWrt YK-L1 image
        run: |
          set -e

          IMAGE_URL="https://downloads.openwrt.org/releases/25.12.4/targets/ramips/mt7620/openwrt-25.12.4-ramips-mt7620-youku_yk-l1-squashfs-sysupgrade.bin"
          IMAGE="/tmp/openwrt-y k-l1.bin"
          ROOT="/tmp/openwrt-root"

          IMAGE="/tmp/openwrt-yk-l1.bin"
          mkdir -p "$ROOT"

          echo "===== Download OpenWrt image ====="
          wget -O "$IMAGE" "$IMAGE_URL"

          echo "===== Image information ====="
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"
          file "$IMAGE"

          echo "===== Locate SquashFS ====="
          python3 - "$IMAGE" <<'PY'
          import sys

          path = sys.argv[1]
          with open(path, "rb") as f:
              data = f.read()

          magic = b"hsqs"
          offsets = []
          pos = 0

          while True:
              pos = data.find(magic, pos)
              if pos < 0:
                  break
              offsets.append(pos)
              pos += 1

          print("SquashFS offsets:", offsets)
          if not offsets:
              raise SystemExit("ERROR: SquashFS filesystem not found")

          with open("/tmp/squashfs-offset.txt", "w") as f:
              f.write(str(offsets[0]))
          PY

          OFFSET="$(cat /tmp/squashfs-offset.txt)"
          echo "Using SquashFS offset: $OFFSET"

          echo "===== SquashFS metadata ====="
          unsquashfs -s -offset "$OFFSET" "$IMAGE"

          echo "===== Extract filesystem ====="
          unsquashfs -no-progress -offset "$OFFSET" -d "$ROOT" "$IMAGE"

          echo "===== Wi-Fi drivers and firmware ====="
          find "$ROOT/lib/modules" "$ROOT/lib/firmware" \
            -type f 2>/dev/null \
            | grep -Ei 'wifi|wireless|mt76|rt2|ralink|mediatek|mac80211' \
            | head -250 || true

          echo "===== Wireless scripts ====="
          find "$ROOT/lib/netifd" "$ROOT/etc/hotplug.d" \
            "$ROOT/etc/init.d" -type f 2>/dev/null \
            | grep -Ei 'wireless|wifi|net|wlan|wpa' \
            | head -200 || true

          echo "===== Wireless configuration ====="
          if [ -f "$ROOT/etc/config/wireless" ]; then
            sed -n '1,240p' "$ROOT/etc/config/wireless"
          fi

          echo "===== Reconnect-related strings ====="
          grep -RInaE \
            'reconnect|auto.?connect|apcli|wpa_supplicant|scan_retry|retry.*connect' \
            "$ROOT/lib/netifd" "$ROOT/etc/hotplug.d" \
            "$ROOT/etc/config" "$ROOT/etc/init.d" \
            2>/dev/null | head -300 || true

          echo "===== Wireless packages ====="
          grep -Ei 'wpad|hostapd|supplicant|mt76|kmod.*wifi|wireless' \
            "$ROOT/usr/lib/opkg/status" 2>/dev/null \
            | head -200 || true

      - name: Inspect Padavan reconnect logic
        run: |
          set -e
          cd /opt/rt-n56u/trunk/proprietary/rt_wifi/rtsoc/4.1.X.X/mt7628/embedded

          echo "===== APCLI reconnect state ====="
          sed -n '700,755p' ap/apcli_ctrl.c

          echo "===== Scan completion ====="
          sed -n '185,225p' common/scan.c

          echo "===== Link down ====="
          sed -n '1000,1110p' ap/ap_apcli.c

          echo "===== Candidate selection ====="
          sed -n '3130,3340p' ap/ap_apcli.c

      - name: Download toolchain
        run: |
          set -e
          cd /opt/rt-n56u/toolchain-mipsel
          sh dl_toolchain.sh

      - name: Configure and build firmware
        run: |
          set -e
          cd /opt/rt-n56u/trunk

          cp configs/templates/YK-L1.config .config

          sudo ./clear_tree
          sudo ./build_firmware_modify YK-L1 0

          test -n "$(find images -maxdepth 1 -type f -name '*.trx' -print -quit)"
          cp images/*.trx "$GITHUB_WORKSPACE/output/"

      - name: Show firmware details
        run: |
          set -e
          ls -lh output/
          sha256sum output/*.trx

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-YK-L1
          path: output/*.trx
          if-no-files-found: error
          retention-days: 14
