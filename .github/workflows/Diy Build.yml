name: Build Padavan-NG YK-L1 3.4.4.0-104

on:
  workflow_dispatch:
  push:
    branches:
      - padavan-ng-104

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4
        with:
          ref: padavan-ng-104

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake autopoint bison \
            build-essential ca-certificates cmake cpio curl dos2unix \
            doxygen fakeroot flex gawk gettext git gperf help2man \
            kmod libarchive-tools libblkid-dev libcurl4-openssl-dev \
            libgmp3-dev libidn2-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libsqlite3-dev libssl-dev \
            libtool libtool-bin locales pkg-config python3 \
            python3-docutils texinfo unzip wget xxd zlib1g-dev

      - name: Download Padavan-NG source
        run: |
          set -e
          git clone https://github.com/nilabsent/padavan-ng.git padavan-ng
          cd padavan-ng
          git checkout d2c584629
          echo "===== Source revision ====="
          git rev-parse HEAD

      - name: Verify YK-L1 configuration and source support
        run: |
          set -e
          CONFIG="$GITHUB_WORKSPACE/trunk/configs/templates/YK-L1.config"
          test -s "$CONFIG"

          echo "===== Custom YK-L1 configuration ====="
          grep -E '^(CONFIG_VENDOR|CONFIG_PRODUCT|CONFIG_FIRMWARE_PRODUCT_ID|CONFIG_FIRMWARE_WIFI2_DRIVER)=' "$CONFIG"

          echo "===== YK-L1 references in Padavan-NG ====="
          cd padavan-ng
          git grep -in 'YK-L1' || true

          echo "===== Build scripts ====="
          find . -maxdepth 3 -type f \
            \( -name 'build_firmware.sh' -o -name 'clear_tree.sh' -o -name 'build_toolchain.sh' \) \
            -print

          echo "===== Configuration templates ====="
          find trunk/configs/templates -type f 2>/dev/null | head -100

      - name: Prepare configuration
        run: |
          set -e
          cp "$GITHUB_WORKSPACE/trunk/configs/templates/YK-L1.config" \
            padavan-ng/trunk/.config
          grep -E '^(CONFIG_VENDOR|CONFIG_PRODUCT|CONFIG_FIRMWARE_PRODUCT_ID|CONFIG_FIRMWARE_WIFI2_DRIVER)=' \
            padavan-ng/trunk/.config

      - name: Build toolchain
        run: |
          set -e
          cd padavan-ng/toolchain
          ./build_toolchain.sh

      - name: Build firmware
        run: |
          set -e
          cd padavan-ng/trunk
          ./clear_tree.sh
          ./build_firmware.sh

      - name: Check firmware output
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/output"

          IMAGE="$(find padavan-ng/trunk/images -maxdepth 1 -type f \
            \( -name '*.trx' -o -name '*.bin' \) -print -quit)"

          if [ -z "$IMAGE" ]; then
            echo "::error::No firmware image was produced."
            exit 1
          fi

          echo "===== Firmware image ====="
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"
          cp "$IMAGE" "$GITHUB_WORKSPACE/output/"
          cp trunk/configs/templates/YK-L1.config "$GITHUB_WORKSPACE/output/"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-NG-YK-L1-3.4.4.0-104
          path: output/*
          if-no-files-found: error
          retention-days: 14
