name: Build Padavan-NG YK-L1 3.4.4.0-104

on:
  workflow_dispatch:
  push:
    branches:
      - padavan-ng-104

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4
        with:
          ref: padavan-ng-104

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint cmake bison build-essential \
            flex gawk gettext git gperf libtool libtool-bin \
            pkg-config fakeroot kmod cpio doxygen texinfo help2man \
            libncurses5-dev zlib1g-dev libsqlite3-dev gcc-multilib \
            curl dos2unix unzip wget locales xxd libltdl-dev \
            libgmp3-dev libmpfr-dev libarchive-tools libblkid-dev

      - name: Download Padavan-NG source
        run: |
          set -e
          git clone https://github.com/nilabsent/padavan-ng.git padavan-ng
          cd padavan-ng
          git checkout d2c584629

      - name: Download toolchain
        run: |
          set -e
          wget -O /tmp/toolchain.tar.xz \
            https://github.com/nilabsent/padavan-ng-builder/releases/download/release-2026.06.08_17.14.58/toolchain_uClibc-ng-1.0.58.tar.xz
          tar -xJf /tmp/toolchain.tar.xz -C padavan-ng

      - name: Verify board configuration
        run: |
          set -e
          test -f trunk/configs/templates/YK-L1.config || true
          test -f trunk/configs/boards/YOUKU/YK-L1/partitions.config
          test -f trunk/build_firmware.sh
        working-directory: padavan-ng

      - name: Configure and build YK-L1
        run: |
          set -e
          cp "$GITHUB_WORKSPACE/trunk/configs/templates/YK-L1.config" \
             padavan-ng/trunk/.config

          cd padavan-ng/trunk
          sed -i 's/\r$//g' .config
          ./clear_tree.sh
          ./build_firmware.sh

      - name: Check firmware size
        run: |
          set -e
          mkdir -p output

          PARTITIONS="padavan-ng/trunk/configs/boards/YOUKU/YK-L1/partitions.config"
          IMAGE="$(find padavan-ng/trunk/images -maxdepth 1 -type f \
            \( -name '*.trx' -o -name '*.bin' \) -print -quit)"

          test -n "$IMAGE"
          echo "Firmware: $IMAGE"
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"

          echo "Board partition limits:"
          cat "$PARTITIONS"

          cp "$IMAGE" output/
          cp "$GITHUB_WORKSPACE/trunk/configs/templates/YK-L1.config" output/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-NG-YK-L1-3.4.4.0-104
          path: output/*
          if-no-files-found: error
          retention-days: 14
