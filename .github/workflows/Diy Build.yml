```yaml
name: Build Padavan YK-L1

'on':
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip libtool-bin curl cmake gperf gawk flex bison \
            xxd fakeroot cpio git python3-docutils gettext \
            automake autopoint texinfo build-essential help2man \
            pkg-config zlib1g-dev libgmp3-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libltdl-dev wget

      - name: Download Padavan source
        run: |
          git clone --depth=1 https://github.com/a0575/padavan.git /opt/rt-n56u
          test -f /opt/rt-n56u/trunk/configs/templates/YK-L1.config
          mkdir -p "$GITHUB_WORKSPACE/output"

      - name: Inspect AP-client reconnect code
        run: |
          grep -RniE --include='*.c' --include='*.h' \
            'ApCliAutoConnect|APCLI_AUTO_CONNECT_SUPPORT|ApCliBssid|ApCliEnable' \
            /opt/rt-n56u/trunk 2>/dev/null | head -n 100 || true

      - name: Download toolchain
        run: |
          cd /opt/rt-n56u/toolchain-mipsel
          sh dl_toolchain.sh

      - name: Configure and build firmware
        run: |
          set -e
          cd /opt/rt-n56u/trunk
          cp configs/templates/YK-L1.config .config
          sudo ./clear_tree
          sudo ./build_firmware_modify YK-L1 0
          test -n "$(find images -maxdepth 1 -type f -name '*.trx' -print -quit)"
          cp images/*.trx "$GITHUB_WORKSPACE/output/"

      - name: Show firmware details
        run: |
          ls -lh output/
          sha256sum output/*.trx

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-YK-L1
          path: output/*.trx
          if-no-files-found: error
          retention-days: 14
```
